<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="format-detection" content="telephone=no"><meta name="format-detection" content="email=no"><meta name="format-detection" content="address=no">
<meta name="theme-color" content="#0B1F3A">
<title>Conciergerie Personnalisée | L’Adresse SARL</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
*{ -webkit-tap-highlight-color:transparent }
.hero-pano{position:relative;min-height:84vh;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;overflow:hidden;padding:120px 20px 80px}
.hero-pano-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hero-pano-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,31,58,.55),rgba(11,31,58,.88));z-index:1}
.hero-pano-content{position:relative;z-index:2;max-width:920px}
.form-field,.simple-tel{width:100%;padding:12px 14px;border:1px solid #d6dbe4;border-radius:10px;font:inherit;background:#fff}
.field-label{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px;display:block}
.conditional-field{display:none}.conditional-field.visible{display:block;animation:fadeIn .3s}@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.opt-card{border:1.5px solid var(--border);border-radius:14px;padding:0;overflow:hidden;background:#fff;cursor:pointer;transition:.2s;display:flex;align-items:stretch;min-height:88px}
.opt-card.selected{border-color:#0B1F3A;box-shadow:0 0 0 2px #C9A86A;background:#FFFEF8}
.opt-card img{width:88px;min-width:88px;height:88px;aspect-ratio:1/1;object-fit:cover;display:block;flex-shrink:0}
.opt-card .opt-text{padding:12px 14px;flex:1;display:flex;flex-direction:column;justify-content:center}
.opt-card .opt-text strong{display:block;font-size:13.5px;color:var(--navy);line-height:1.2}
.opt-card .opt-text small{color:var(--muted);font-size:11.5px;display:block;margin-top:4px}
.besoin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.besoin-card{border:1.5px solid var(--border);border-radius:12px;padding:14px;background:#fff;cursor:pointer;text-align:center;font-weight:600;font-size:13px;transition:.2s}
.besoin-card.selected{border-color:#0B1F3A;box-shadow:0 0 0 2px #C9A86A;background:#0B1F3A;color:#fff}
.budget-box{display:flex;gap:10px;margin-top:10px}
.budget-box label{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:13px;background:#fff;text-align:center}
.budget-box label.selected{border-color:#0B1F3A;box-shadow:0 0 0 2px #C9A86A;background:#0B1F3A;color:#fff}
.extra-box{border:1px solid var(--border);background:#fff;border-radius:12px;padding:12px;margin-top:12px}
.recap{background:#0B1F3A;color:#fff;border-radius:12px;padding:14px;margin-bottom:16px;font-size:12.5px;line-height:1.7}
.recap span{color:#C9A86A}
.voiture-opt{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.voiture-opt label{border:1.5px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;text-align:center}
.voiture-opt label.selected{border-color:#0B1F3A;box-shadow:0 0 0 2px #C9A86A}
.voiture-opt img{width:100%;height:70px;object-fit:cover;display:block}
.voiture-opt span{display:block;padding:6px;font-size:12px;font-weight:600}
@media(max-width:768px){.hero-pano{min-height:78vh;padding:90px 18px 50px}.hero-pano h1{font-size:34px !important}.besoin-grid{grid-template-columns:1fr 1fr}.opt-card img{width:72px;min-width:72px;height:72px}}
</style>
</head>
<body>
<header class="top-header">
<a class="brand" href="index.html"><div class="brand-icon">L</div><div class="brand-name">L’ADRESSE SARL</div></a>
<nav class="nav" id="mainNav"><a href="index.html">Accueil</a><a href="qui-sommes-nous.html">Qui sommes-nous</a><a href="index.html#services-cards">Services</a><a href="blog.html">Blog</a><a href="espace-client.html">Mon espace client</a></nav>
<button class="burger" id="burgerBtn">☰</button>
</header>

<section class="hero-pano">
<img class="hero-pano-img" src="b7.jpg" alt="Conciergerie">
<div class="hero-pano-overlay"></div>
<div class="hero-pano-content">
<span class="eyebrow">L’Adresse Conciergerie</span>
<h1>Conciergerie Personnalisée</h1>
<h2>Besoin → Personnaliser → Demande – avec Récapitulatif</h2>
<div class="hero-btns"><a class="btn-gold" href="#cfg">Demander</a></div>
</div>
</section>

<section style="padding:80px 0;background:#F8F3ED" id="cfg"><div class="container">
<div class="config-wrap">
<div class="config-tabs"><button class="active" data-s="1">1. Besoin</button><button data-s="2">2. Personnaliser</button><button data-s="3">3. Demande</button></div>
<div class="config-body" id="cfgBody"></div>
</div>
</div></section>

<footer class="footer-universal"><div class="footer-grid"><div><p>L’ADRESSE SARL – Glass</p><p><a href="https://wa.me/24162516457" style="color:#E9D9B8">WhatsApp</a></p></div><div><h4>Navigation</h4><a href="index.html">Accueil</a><a href="index.html#services-cards">Services</a></div><div><h4>Légal</h4><a href="cgv.html">CGV</a></div></div><div class="footer-bottom"><span>© 2026 L’Adresse</span></div></footer>

<script>
const SHEET_URL="https://script.google.com/macros/s/AKfycbww-7Nn7ro4OZ-R1oVuoLSdY6P7OWOHJzLl0I4KNazjOXjGYWlmxFzpq-ti7sHGA2zP/exec";
const WA="24162516457";
const state={
  besoin:"", services:[], ville:"", lieu:"", personnes:"", 
  prefCul:"Non", prefDetail:"", 
  securiteNb:"1 agent",
  djDuree:"", djStyle:"Mix généraliste", danseDuree:"", danseNb:"2",
  voitureType:"", voitureDuree:"Courte journée", voitureDureeDetail:"", voitureJours:"1",
  chauffeurDuree:"Courte journée", chauffeurJours:"1", chauffeurDetail:"",
  conf:"Standard", nom:"", tel:"", description:"", budget:"ouvert", budgetMontant:""
};

const VOITURES=[
 {id:"Berline",label:"Berline",img:"https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=300&q=80"},
 {id:"SUV",label:"SUV",img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=300&q=80"},
 {id:"4x4",label:"4x4",img:"https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=300&q=80"},
 {id:"Minivan",label:"Minivan",img:"https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=300&q=80"},
 {id:"Prestige",label:"Prestige",img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=300&q=80"}
];

const DATA={
  Quotidien:[
    {key:"Courses",label:"Courses urgentes & Cadeaux",desc:"Supermarché, pharmacie, cadeaux",img:"https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=200&q=80",needPerson:false},
    {key:"Pressing",label:"Pressing & Blanchisserie",desc:"Collecte, repassage, livraison",img:"https://images.unsplash.com/photo-1582735689369-4fe89db7114c?w=200&q=80",needPerson:false},
    {key:"Colis",label:"Gestion de colis & Livraisons",desc:"Réception et distribution",img:"https://images.unsplash.com/photo-1580674684081-7617fbf3d5c5?w=200&q=80",needPerson:false},
    {key:"Entretien",label:"Entretien du domicile",desc:"Petits travaux, maintenance",img:"https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=200&q=80",needPerson:false},
    {key:"Menage",label:"Ménage & Rangement",desc:"Haut standing, équipe vérifiée",img:"https://images.unsplash.com/photo-1527515637462-cff94eecc1ac?w=200&q=80",needPerson:false},
    {key:"Nounou",label:"Nounou & Garde d'enfants",desc:"Journée, soirée",img:"b7.jpg",needPerson:true,personLabel:"Nombre d'enfants",personPlaceholder:"Ex: 2 enfants, 3 ans et 5 ans"},
    {key:"Voiture",label:"Location voiture",desc:"Service indépendant – Type + Durée",img:"https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=200&q=80",needPerson:false},
    {key:"Chauffeur",label:"Chauffeur privé",desc:"Service indépendant – Durée",img:"https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=200&q=80",needPerson:false},
    {key:"Chef",label:"Chef privé",desc:"Dîner à domicile",img:"b8.jpg",needPerson:true,personLabel:"Nombre de convives",personPlaceholder:"Ex: 6 convives"},
    {key:"AutreQuo",label:"Autre type de service – Précisez",desc:"Décrivez votre besoin",img:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=200&q=80",needPerson:false}
  ],
  Personnalisée:[
    {key:"SurMesure",label:"Demande entièrement personnalisée",desc:"Expliquez-nous tout",img:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=200&q=80",needPerson:false},
    {key:"ConciergePerso",label:"Concierge dédié 24/7",desc:"Un interlocuteur unique",img:"https://images.unsplash.com/photo-1551836022-deb4988cc6c0?w=200&q=80",needPerson:false},
    {key:"Voiture",label:"Location voiture",desc:"Service indépendant",img:"https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=200&q=80",needPerson:false},
    {key:"Chauffeur",label:"Chauffeur privé",desc:"Service indépendant",img:"https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=200&q=80",needPerson:false}
  ]
};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getPersonInfo(){
  const list=DATA[state.besoin]||[];
  const selected=list.filter(s=>state.services.includes(s.key)&&s.needPerson);
  if(selected.length===0) return null;
  const prio=selected.find(s=>s.key==='Nounou')||selected.find(s=>s.key.includes('Chef'))||selected[0];
  return prio;
}
function buildRecap(){
  let lignes=`<div><span>Besoin:</span> ${esc(state.besoin)}</div>`;
  lignes+=`<div><span>Services:</span> ${state.services.length?esc(state.services.join(', ')):'Aucun'}</div>`;
  const p=getPersonInfo(); if(p && state.personnes) lignes+=`<div><span>${esc(p.personLabel)}:</span> ${esc(state.personnes)}</div>`;
  if(state.services.includes('Securite')) lignes+=`<div><span>Sécurité:</span> ${esc(state.securiteNb)}</div>`;
  if(state.services.includes('Voiture')) lignes+=`<div><span>Voiture:</span> ${esc(state.voitureType||'À choisir')} – ${esc(state.voitureDuree)} ${state.voitureDuree==='Jour'?'('+esc(state.voitureJours)+' jour(s) max 7)':state.voitureDureeDetail?`(${esc(state.voitureDureeDetail)})`:''}</div>`;
  if(state.services.includes('Chauffeur')) lignes+=`<div><span>Chauffeur:</span> ${esc(state.chauffeurDuree)} ${state.chauffeurDuree==='Jour'?'('+esc(state.chauffeurJours)+' jour(s) max 7)':esc(state.chauffeurDetail)}</div>`;
  if(state.services.includes('DJ')) lignes+=`<div><span>DJ:</span> ${esc(state.djDuree)} – ${esc(state.djStyle)}</div>`;
  if(state.services.includes('Danse')) lignes+=`<div><span>Danse:</span> ${esc(state.danseNb)} – ${esc(state.danseDuree)}</div>`;
  if(state.services.includes('Chef')||state.services.includes('ChefFete')) lignes+=`<div><span>Chef:</span> ${esc(state.prefCul)} ${esc(state.prefDetail)}</div>`;
  if(state.ville||state.lieu) lignes+=`<div><span>Lieu:</span> ${esc(state.ville)} ${esc(state.lieu)?'– '+esc(state.lieu):''}</div>`;
  return `<div class="recap">${lignes}</div>`;
}

function render(step){
  const body=document.getElementById('cfgBody');
  if(step===1){
    body.innerHTML=`<div style="padding:24px">
    <p style="font-size:13px;color:#665f57;margin-bottom:14px">Choisissez le type de demande – Quotidien ou Personnalisée (Business et Événement sont sur leurs pages dédiées).</p>
    <div class="besoin-grid">${Object.keys(DATA).map(k=>`<div class="besoin-card ${state.besoin===k?'selected':''}" data-k="${k}">${k}</div>`).join('')}</div>
    <div style="text-align:right;margin-top:20px"><button class="btn-gold" id="to2">Continuer →</button></div><p id="err" style="color:#9b1c1c;margin-top:10px"></p></div>`;
    body.querySelectorAll('.besoin-card').forEach(c=>c.onclick=()=>{state.besoin=c.dataset.k; state.services=[]; render(1);});
    document.getElementById('to2').onclick=()=>{if(!state.besoin){document.getElementById('err').textContent='Choisissez Quotidien ou Personnalisée';return;} render(2);};

  }else if(step===2){
    const list=DATA[state.besoin]||[];
    const hasChef=state.services.includes('Chef')||state.services.includes('ChefFete');
    const hasSec=state.services.includes('Securite');
    const hasDJ=state.services.includes('DJ');
    const hasDanse=state.services.includes('Danse');
    const hasVoiture=state.services.includes('Voiture');
    const hasChauffeur=state.services.includes('Chauffeur');
    const personInfo=getPersonInfo();
    body.innerHTML=`<div style="padding:24px">
      <div style="background:#F8F3ED;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px"><strong>${esc(state.besoin)}</strong> – Sélectionnez un ou plusieurs services (Voiture et Chauffeur sont indépendants)</div>
      <div class="opt-grid">${list.map(s=>{
        const sel=state.services.includes(s.key);
        return `<div class="opt-card ${sel?'selected':''}" data-key="${s.key}"><img src="${s.img}" loading="lazy" alt="${s.label}"><div class="opt-text"><strong>${s.label}</strong><small>${s.desc}${s.needPerson?' – '+s.personLabel:''}</small></div></div>`;
      }).join('')}</div>

      ${hasSec?`<div class="extra-box"><span class="field-label">Sécurité – Combien d'agents ?</span>
      <select id="secNb" class="form-field" style="margin-top:8px">
        <option ${state.securiteNb==='1 agent'?'selected':''}>1 agent</option><option ${state.securiteNb==='2 agents'?'selected':''}>2 agents</option><option ${state.securiteNb==='3 agents'?'selected':''}>3 agents</option><option ${state.securiteNb==='4 agents'?'selected':''}>4 agents</option><option ${state.securiteNb==='5 agents'?'selected':''}>5 agents</option><option ${state.securiteNb==='Escort policier (plus de 5 / besoin officiel)'?'selected':''}>Escort policier (plus de 5 / besoin officiel)</option>
      </select></div>`:''}

      ${hasVoiture?`<div class="extra-box" style="border-color:#C9A86A"><span class="field-label">Location voiture – Type de véhicule (comme Travel)</span>
        <div class="voiture-opt">${VOITURES.map(v=>`<label class="${state.voitureType===v.id?'selected':''}" data-v="${v.id}"><img src="${v.img}"><span>${v.label}</span></label>`).join('')}</div>
        <div style="margin-top:12px"><span class="field-label">Durée de location – Courte journée / Jour (max 7 jours) / Personnalisé</span>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px">
            ${["Courte journée","Jour","Personnalisé"].map(d=>`<label style="border:1.5px solid ${state.voitureDuree===d?'#0B1F3A':'var(--border)'};padding:10px;border-radius:10px;cursor:pointer;text-align:center;background:${state.voitureDuree===d?'#0B1F3A;color:#fff':'#fff'}"><input type="radio" name="voitDuree" value="${d}" ${state.voitureDuree===d?'checked':''} style="display:none"> ${d}</label>`).join('')}
          </div>
          <div class="${state.voitureDuree==='Jour'?'conditional-field visible':'conditional-field'}" style="margin-top:8px"><label class="field-label">Nombre de jours (max 7)</label><input id="voitureJours" type="number" min="1" max="7" class="form-field" value="${esc(state.voitureJours)}"></div>
          <div class="${state.voitureDuree==='Personnalisé'?'conditional-field visible':'conditional-field'}" style="margin-top:8px"><input id="voitureDetail" class="form-field" placeholder="Ex: 3 jours, avec chauffeur, livraison Glass..." value="${esc(state.voitureDureeDetail)}"></div>
        </div>
      </div>`:''}

      ${hasChauffeur?`<div class="extra-box" style="border-color:#0B1F3A"><span class="field-label">Chauffeur – Pour combien de temps ? (indépendant de la voiture)</span>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px">
          ${["Courte journée","Jour","Personnalisé"].map(d=>`<label style="border:1.5px solid ${state.chauffeurDuree===d?'#0B1F3A':'var(--border)'};padding:10px;border-radius:10px;cursor:pointer;text-align:center;background:${state.chauffeurDuree===d?'#0B1F3A;color:#fff':'#fff'}"><input type="radio" name="chauffDuree" value="${d}" ${state.chauffeurDuree===d?'checked':''} style="display:none"> ${d}</label>`).join('')}
        </div>
        <div class="${state.chauffeurDuree==='Jour'?'conditional-field visible':'conditional-field'}" style="margin-top:8px"><label class="field-label">Nombre de jours (max 7)</label><input id="chauffJours" type="number" min="1" max="7" class="form-field" value="${esc(state.chauffeurJours)}"></div>
        <div class="${state.chauffeurDuree==='Personnalisé'?'conditional-field visible':'conditional-field'}" style="margin-top:8px"><input id="chauffDetail" class="form-field" placeholder="Ex: 08h-18h, avec nuit, trajet Port-Gentil..." value="${esc(state.chauffeurDetail)}"></div>
      </div>`:''}

      ${hasDJ?`<div class="extra-box"><span class="field-label">DJ – Pour combien de temps ?</span>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">
          <input id="djDuree" class="form-field" placeholder="Ex: 4 heures, 19h-02h" value="${esc(state.djDuree)}">
          <select class="form-field" id="djStyle"><option>Mix généraliste</option><option>Afro / Coupé-décalé</option><option>Amapiano</option><option>RnB / Slow</option><option>Traditionnel gabonais</option></select>
        </div>
      </div>`:''}

      ${hasDanse?`<div class="extra-box"><span class="field-label">Danseuses / Danseurs – Durée & Nombre</span>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">
          <input id="danseDuree" class="form-field" placeholder="Durée – Ex: 2h, 30 min x 3 passages" value="${esc(state.danseDuree)}">
          <input id="danseNb" class="form-field" placeholder="Nombre – Ex: 2 danseuses, 4 danseurs" value="${esc(state.danseNb)}">
        </div>
      </div>`:''}

      <div style="margin-top:22px;border-top:1px solid var(--border);padding-top:18px">
        <h4 style="font-size:14px;margin-bottom:10px">Ville & Lieu de Résidence (non obligatoire)</h4>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <label><span class="field-label">Ville</span><input id="ville" class="form-field" placeholder="Libreville, Port-Gentil, Paris..." value="${esc(state.ville)}"></label>
          <label><span class="field-label">Lieu de Résidence</span><input id="lieu" class="form-field" placeholder="Glass, Batterie IV..." value="${esc(state.lieu)}"></label>
        </div>
        
        ${personInfo?`<label style="margin-top:14px;display:block" class="conditional-field visible"><span class="field-label">${esc(personInfo.personLabel)} *</span><input id="pers" class="simple-tel" placeholder="${esc(personInfo.personPlaceholder)}" value="${esc(state.personnes)}"></label>`:''}
        
        <div class="${hasChef?'conditional-field visible':'conditional-field'}" style="margin-top:16px;border:1px solid var(--border);padding:12px;border-radius:12px;background:#fff">
          <label class="field-label">Avez-vous une préférence culinaire ?</label>
          <div style="display:flex;gap:10px;margin-top:8px">
            <label style="border:1px solid var(--border);padding:8px 14px;border-radius:20px;cursor:pointer;background:${state.prefCul==='Non'?'#0B1F3A;color:#fff':''}"><input type="radio" name="pref" value="Non" ${state.prefCul==='Non'?'checked':''} style="display:none"> Non</label>
            <label style="border:1px solid var(--border);padding:8px 14px;border-radius:20px;cursor:pointer;background:${state.prefCul==='Oui'?'#0B1F3A;color:#fff':''}"><input type="radio" name="pref" value="Oui" ${state.prefCul==='Oui'?'checked':''} style="display:none"> Oui</label>
          </div>
          <div class="${state.prefCul==='Oui'?'conditional-field visible':'conditional-field'}" style="margin-top:10px">
            <input id="prefDetail" class="form-field" placeholder="Ex: Vegana, végétarien, halal, allergies..." value="${esc(state.prefDetail)}">
          </div>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;margin-top:22px"><button id="b1" style="background:transparent;border:1px solid var(--border);padding:12px;border-radius:10px">← Retour</button><button class="btn-gold" id="to3">Continuer →</button></div><p id="err" style="color:#9b1c1c;margin-top:10px"></p></div>`;

    body.querySelectorAll('.opt-card').forEach(c=>{
      c.onclick=()=>{const k=c.dataset.key; if(state.services.includes(k)) state.services=state.services.filter(x=>x!==k); else state.services.push(k); render(2);};
    });
    body.querySelectorAll('.voiture-opt label').forEach(l=>l.onclick=()=>{state.voitureType=l.dataset.v; render(2);});
    body.querySelectorAll('input[name=voitDuree]').forEach(r=>r.onchange=e=>{state.voitureDuree=e.target.value; render(2);});
    body.querySelectorAll('input[name=chauffDuree]').forEach(r=>r.onchange=e=>{state.chauffeurDuree=e.target.value; render(2);});
    const secEl=document.getElementById('secNb'); if(secEl) secEl.onchange=e=>state.securiteNb=e.target.value;
    ['djDuree','danseDuree','danseNb','voitureJours','voitureDetail','chauffJours','chauffDetail'].forEach(id=>{const el=document.getElementById(id); if(el) el.oninput=e=>{state[id]=e.target.value; if(id==='voitureJours'&&parseInt(e.target.value)>7) {state.voitureJours='7'; el.value='7';} if(id==='chauffJours'&&parseInt(e.target.value)>7){state.chauffJours='7'; el.value='7';}}; const s=document.getElementById('djStyle'); if(s) s.onchange=e=>state.djStyle=e.target.value;});
    body.querySelectorAll('input[name=pref]').forEach(r=>r.onchange=e=>{state.prefCul=e.target.value; render(2);});
    ['ville','lieu','pers','prefDetail'].forEach(id=>{const el=document.getElementById(id); if(el) el.oninput=e=>{if(id==='ville') state.ville=e.target.value; if(id==='lieu') state.lieu=e.target.value; if(id==='pers') state.personnes=e.target.value; if(id==='prefDetail') state.prefDetail=e.target.value;};});
    document.getElementById('b1').onclick=()=>render(1);
    document.getElementById('to3').onclick=()=>{
      const info=getPersonInfo();
      if(info && !document.getElementById('pers')?.value){document.getElementById('err').textContent=info.personLabel+' requis pour '+info.label; return;}
      if(state.services.length===0){document.getElementById('err').textContent='Sélectionnez au moins un service';return;}
      if(state.services.includes('Voiture') && !state.voitureType){document.getElementById('err').textContent='Choisissez le type de voiture';return;}
      render(3);
    };

  }else{
    const isConf=state.conf==='Confidentielle';
    const personInfo=getPersonInfo();
    const hasChef=state.services.includes('Chef')||state.services.includes('ChefFete');
    body.innerHTML=`<div style="padding:24px">
      ${buildRecap()}
      <div style="display:flex;gap:10px;margin:12px 0">
        <label style="flex:1;border:1.5px solid ${!isConf?'#0B1F3A':'var(--border)'};border-radius:10px;padding:10px;text-align:center;cursor:pointer;background:${!isConf?'#0B1F3A;color:#fff':''}"><input type="radio" name="conf" value="Standard" ${!isConf?'checked':''} style="display:none"> Standard</label>
        <label style="flex:1;border:1.5px solid ${isConf?'#0B1F3A':'var(--border)'};border-radius:10px;padding:10px;text-align:center;cursor:pointer;background:${isConf?'#0B1F3A;color:#fff':''}"><input type="radio" name="conf" value="Confidentielle" ${isConf?'checked':''} style="display:none"> Confidentielle 🔒</label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="${isConf?'conditional-field':'conditional-field visible'}"><label class="field-label">Nom complet</label><input id="nom" class="simple-tel" value="${esc(state.nom)}" placeholder="Nom (solo Standard)"></div>
        <div><label class="field-label">Téléphone *</label><input id="tel" class="simple-tel" placeholder="+241..." value="${esc(state.tel)}"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
        <label><span class="field-label">Ville</span><input id="ville3" class="form-field" value="${esc(state.ville)}"></label>
        <label><span class="field-label">Lieu de Résidence</span><input id="lieu3" class="form-field" value="${esc(state.lieu)}"></label>
      </div>
      ${personInfo?`<div style="margin-top:12px"><label class="field-label">${esc(personInfo.personLabel)} (confirmé)</label><input id="pers3" class="form-field" value="${esc(state.personnes)}"></div>`:''}
      ${hasChef?`<div style="margin-top:12px;border:1px solid var(--border);padding:10px;border-radius:10px;background:#fff"><span class="field-label">Préférence culinaire: ${esc(state.prefCul)} ${state.prefDetail?'- '+esc(state.prefDetail):''}</span></div>`:''}
      <label style="display:block;margin-top:12px"><span class="field-label">Description (facultatif)</span><textarea id="desc" class="form-field" style="min-height:90px">${esc(state.description)}</textarea></label>
      <div style="margin-top:18px"><span class="field-label">Budget</span>
        <div class="budget-box"><label class="${state.budget==='ouvert'?'selected':''}"><input type="radio" name="budget" value="ouvert" ${state.budget==='ouvert'?'checked':''} style="display:none"> Budget ouvert</label><label class="${state.budget==='defini'?'selected':''}"><input type="radio" name="budget" value="defini" ${state.budget==='defini'?'checked':''} style="display:none"> J'ai un budget</label></div>
        <div class="${state.budget==='defini'?'conditional-field visible':'conditional-field'}" style="margin-top:10px"><input id="budgetMontant" class="form-field" placeholder="Montant FCFA" value="${esc(state.budgetMontant)}"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:22px"><button id="b2" style="background:transparent;border:1px solid var(--border);padding:12px 16px;border-radius:10px">← Retour</button><div style="display:flex;gap:8px"><button id="wa" class="btn-gold">WhatsApp</button><button id="mail" style="background:#0B1F3A;color:#fff;border:none;padding:12px 18px;border-radius:100px;font-size:13px">Email</button></div></div><p id="err" style="color:#9b1c1c;margin-top:10px"></p></div>`;
    body.querySelectorAll('input[name=conf]').forEach(r=>r.onchange=e=>{state.conf=e.target.value; render(3);});
    body.querySelectorAll('input[name=budget]').forEach(r=>r.onchange=e=>{state.budget=e.target.value; render(3);});
    const bind=(id,key)=>{const el=document.getElementById(id); if(el) el.oninput=e=>state[key]=e.target.value;};
    bind('nom','nom'); bind('tel','tel'); bind('ville3','ville'); bind('lieu3','lieu'); bind('pers3','personnes'); bind('desc','description'); bind('budgetMontant','budgetMontant');
    document.getElementById('b2').onclick=()=>render(2);
    document.getElementById('wa').onclick=()=>submit('WhatsApp'); document.getElementById('mail').onclick=()=>submit('Email');
  }
  document.querySelectorAll('.config-tabs button').forEach((b,i)=>b.classList.toggle('active',i+1===step));
}

function submit(src){
  const tel=document.getElementById('tel')?.value||state.tel;
  if(!tel || tel.replace(/\D/g,'').length<8){document.getElementById('err').textContent='Téléphone invalide – +241...';return;}
  const personInfo=getPersonInfo();
  const msg=`CONCIERGERIE ${state.besoin}
Services: ${state.services.join(', ')}
${personInfo?personInfo.personLabel+': '+state.personnes+'\n':''}${state.services.includes('Securite')?`Sécurité: ${state.securiteNb}\n`:''}${state.services.includes('Voiture')?`Voiture: ${state.voitureType} – ${state.voitureDuree} ${state.voitureDuree==='Jour'?state.voitureJours+' jours':state.voitureDureeDetail}\n`:''}${state.services.includes('Chauffeur')?`Chauffeur: ${state.chauffeurDuree} ${state.chauffeurDuree==='Jour'?state.chauffeurJours+' jours':state.chauffeurDetail}\n`:''}DJ: ${state.djDuree||'N/A'} ${state.djStyle||''}
Danse: ${state.danseNb} – ${state.danseDuree||'N/A'}
Ville: ${state.ville}
Lieu: ${state.lieu}
Pref culinaire: ${state.prefCul} ${state.prefDetail||''}
Conf: ${state.conf}
Nom: ${state.conf==='Confidentielle'?'[CONFIDENTIEL]':state.nom}
Tel: ${tel}
Budget: ${state.budget==='ouvert'?'ouvert':state.budgetMontant}
Desc: ${state.description}`;
  const finalMsg=(state.conf==='Confidentielle'?'[CONFIDENTIEL] ':'')+msg;
  if(src==='WhatsApp') window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(finalMsg),'_blank');
  else window.location.href='mailto:magangabridge@gmail.com?subject=Conciergerie '+encodeURIComponent(state.besoin)+'&body='+encodeURIComponent(finalMsg);
  try{ fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({service:'CONCIERGERIE',...state,tel,source:src})}); }catch{}
}
document.addEventListener('DOMContentLoaded',()=>{
  render(1);
  const b=document.getElementById('burgerBtn'),n=document.getElementById('mainNav');
  b.onclick=()=>{const o=n.classList.toggle('open');b.textContent=o?'✕':'☰';};
});
</script>
</body>
</html>
